name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: macos-latest
            maven-command: ./mvnw
          - os: windows-latest
            maven-command: .\mvnw.cmd
          - os: ubuntu-latest
            maven-command: ./mvnw
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Build, test, and run static analysis
        run: ${{ matrix.maven-command }} -B -Prelease clean verify
